<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>396hz</title>
    <style>
        /* ===== ROOT ===== */
        :root {
            --bg: #111214;
            --bg2: #1a1b1e;
            --panel: #1e1f22;
            --border: #2b2c2f;
            --text: #e7e7e8;
            --sub: #8b8d92;
            --accent: #ffffff;
            --hover: #232427;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh; /* accounts for mobile browser chrome */
            overflow: hidden;
        }

        /* ===== SHARED PANNING BACKGROUND ===== */
        .pan-bg {
            background-image: url('/static/wbkg.webp');
            background-repeat: repeat-x;
            background-size: auto 100%;
            background-position: 0 0;
        }

        /* ===== HOMEPAGE ===== */
        #homepage {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 1000;
            overflow-y: auto; /* safety valve on very short viewports, never clip content */
        }
        #homepage::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }
        #homepage>* {
            position: relative;
            z-index: 2;
        }

        /* ===== CENTER CONTENT ===== */
        /* flex:1 + centered content, with desc-bottom as a normal-flow sibling below it,
           means the content is always vertically centered in whatever space is left,
           and the footer text can never overlap it, regardless of aspect ratio. */
        #homepageText {
            flex: 1 1 auto;
            width: min(600px, 86vw);
            min-height: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vh, 20px);
            padding: 4vh 0;
        }

        /* ——— vector logo ——— */
        #main-logo {
            /* scales with width AND height so it never overflows short viewports */
            width: min(80%, 500px, 48vh);
            margin: 0 auto;
        }
        #main-logo svg {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.9));
        }

        /* ===== LOGIN CONTROLS ===== */
        #loginControls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* plain white text, no underline, no box */
        .text-btn {
            background: transparent;
            border: none;
            padding: 0;
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(1rem, 0.6vw + 0.6vh, 1.2rem);
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s ease;
            line-height: 1.5;
            text-decoration: none;
        }
        .text-btn:hover {
            opacity: 1;
            color: #ffffff;
        }

        #loginForm {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        #loginPasswordInput {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            color: white;
            padding: 10px 15px;
            width: min(350px, 75vw);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }
        #loginPasswordInput::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        #loginPasswordInput:focus {
            outline: none;
            border-color: #ffffff;
        }

        #loginError {
            color: #ff6b6b;
            min-height: 1.2em;
            font-size: 0.9rem;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
        }

        #homepage .desc-bottom {
            flex: 0 0 auto;
            width: 100%;
            text-align: center;
            font-size: clamp(0.8rem, 0.45vw + 0.45vh, 1rem);
            color: #f0f0f0;
            opacity: 0.95;
            text-shadow: 0 3px 10px rgba(0,0,0,1), 0 0 40px rgba(0,0,0,0.9);
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.9));
            padding: 0 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            pointer-events: none;
            z-index: 3;
        }

        /* ===== SERVICES PAGE ===== */
        #services-page {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            z-index: 999;
            /* shared sizing tokens: the grey panel and the text box both read from
               these, so they always shrink/grow together no matter the aspect ratio */
            --page-pad: clamp(20px, 6vw, 80px);
            --panel-w: clamp(220px, 32vw, 480px);
            padding: 4vh var(--page-pad);
            overflow-y: auto; /* safety valve if the list ever grows past viewport height */
        }
        @media (max-width: 480px) {
            #services-page {
                --panel-w: clamp(160px, 55vw, 300px);
            }
        }
        #services-page.active {
            display: flex;
        }

        #services-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 70% 50%, transparent 30%, rgba(0, 0, 0, 0.70) 100%);
            pointer-events: none;
            z-index: 0;
        }

        #services-left-bg {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--panel-w);
            height: 100%;
            background: #18191c;
            opacity: 0.9;
            z-index: 1;
            pointer-events: none;
        }

        /* The text box: capped so its right edge can never pass the grey panel's
           right edge, at any aspect ratio - width tracks --panel-w exactly, minus
           the page's own left padding and the left shift below, with a little
           breathing room. --shift is capped to the padding itself so a -28px pull
           toward the wall can't drag text past the page's own left edge either. */
        .services-content {
            position: relative;
            z-index: 2;
            width: 100%;
            --shift: min(28px, var(--page-pad));
            max-width: calc(var(--panel-w) - var(--page-pad) + var(--shift) - 20px);
            transform: translateX(calc(-1 * var(--shift)));
            /* establishes a query container so descendant font-sizes below can be
               set in cqw - i.e. sized off THIS box's real rendered width, so they
               shrink in lockstep with the panel instead of drifting out of sync
               with it on tall/narrow aspect ratios */
            container-type: inline-size;
        }

        .services-title {
            font-size: clamp(1.4rem, 5vw, 2.6rem); /* fallback for browsers without container queries */
            font-size: clamp(1.4rem, 8.5cqw, 2.6rem);
            font-weight: 700;
            color: #fff;
            margin: 0 0 0.15em 0;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            overflow-wrap: break-word;
        }

        .services-sub {
            font-size: clamp(0.85rem, 2.2vw, 1.05rem);
            font-size: clamp(0.85rem, 3.6cqw, 1.05rem);
            color: rgba(255, 255, 255, 0.55);
            margin: 0 0 2em 0;
            font-weight: 400;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.02em;
            overflow-wrap: break-word;
        }

        .services-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75em;
        }

        .services-list li {
            margin: 0;
            padding: 0;
        }

        .services-list a {
            display: inline-block;
            max-width: 100%;
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-size: clamp(1rem, 4.8cqw, 1.4rem);
            font-weight: 400;
            color: #fff;
            text-decoration: none;
            padding: 0.15em 0;
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s ease, opacity 0.25s ease, transform 0.2s ease;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            letter-spacing: -0.01em;
            opacity: 0.85;
            cursor: pointer;
            padding-bottom: 22px;
            overflow-wrap: break-word;
        }

        .services-list a:hover {
            opacity: 1;
            transform: translateX(4px);
        }

        .services-list .service-meta {
            display: block;
            font-size: clamp(0.65rem, 1.8vw, 0.78rem);
            font-size: clamp(0.65rem, 2.8cqw, 0.78rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.40);
            margin-top: 0.1em;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            padding-bottom: 6px;
        }

        .services-divider {
            width: 60px;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
            margin: 0 0 1.5em 0;
        }

        /* Respect reduced-motion preference for the background pan */
        @media (prefers-reduced-motion: reduce) {
            .pan-bg { background-position: 0 0 !important; }
        }
    </style>
</head>

        <div id="homepageText">

            <!-- Login Controls -->
            <div id="loginControls">

                    <button id="homepageLoginBtn" class="text-btn">sign in?</button>

        <div class="desc-bottom">need an account? msg @396hz on discord!</div>
    </div>

    <!-- ===== SERVICES PAGE ===== -->
    <div id="services-page" class="pan-bg">
        <div id="services-left-bg"></div>
        <div class="services-content">
            <div class="services-title">Available Services</div>
            <div class="services-sub">select a tool to begin.</div>
            <div class="services-divider"></div>
            <ul class="services-list">
                <li>
                    <a id="service-acquaintance">
                        Acquaintance
                        <span class="service-meta">R* Social Club Viewer</span>
                    </a>
                    <div>
                    <a id="service-scrVI">
                        scrVI
                        <span class="service-meta">Ai-Assisted Discord Mass Message Analyzer</span>
                    </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // ===== HOMEPAGE LOGIC =====
        const HARDCODED_PASSWORD = "zen";

        const loginPrompt = document.getElementById('loginPrompt');
        const loginForm = document.getElementById('loginForm');
        const loginInput = document.getElementById('loginPasswordInput');
        const loginError = document.getElementById('loginError');
        const homepageLoginBtn = document.getElementById('homepageLoginBtn');
        const authenticateBtn = document.getElementById('authenticateBtn');

        function showLoginForm() {
            loginPrompt.style.display = 'none';
            loginForm.style.display = 'flex';
            loginInput.focus();
        }

        function attemptLogin() {
            if (loginInput.value === HARDCODED_PASSWORD) {
                loginError.textContent = '';
                enterDashboard();
            } else {
                loginError.textContent = 'Incorrect password';
                loginInput.value = '';
                loginInput.focus();
            }
        }

        function enterDashboard() {
            document.getElementById('homepage').style.display = 'none';
            document.getElementById('services-page').classList.add('active');
        }

        // ===== SERVICES -> ACQUAINTANCE =====
        document.getElementById('service-acquaintance').addEventListener('click', function() {
            window.location.href = '/acquaintance';
        });
        document.getElementById('service-scrVI').addEventListener('click', function() {
            window.location.href = '/scrvi';
        });

        // ===== EVENT LISTENERS =====
        homepageLoginBtn.addEventListener('click', showLoginForm);
        authenticateBtn.addEventListener('click', attemptLogin);
        loginInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') attemptLogin();
        });

        // ===== RESOLUTION-INDEPENDENT BACKGROUND PAN =====
        // Old approach hardcoded a 6688px pan distance, which only matched the
        // rendered tile width at one specific viewport height. Since the image is
        // scaled to `auto 100%`, its actual on-screen width changes with every
        // resolution/aspect ratio, so that fixed number caused a visible jump/seam
        // everywhere else. Instead we measure the image's real natural size once,
        // compute the true rendered tile width for the *current* viewport height,
        // and drive the pan with JS so it always loops seamlessly and keeps a
        // consistent "full loop every 120s" speed regardless of screen shape.
        (function () {
            const bgEls = [document.getElementById('homepage'), document.getElementById('services-page')];
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) return;

            const LOOP_SECONDS = 120;
            let tileWidth = 0;
            let offset = 0;
            let lastTime = null;

            function computeTileWidth(naturalW, naturalH) {
                if (!naturalW || !naturalH) return 0;
                return window.innerHeight * (naturalW / naturalH);
            }

            const img = new Image();
            img.src = '/static/wbkg.webp';

            img.onload = function () {
                tileWidth = computeTileWidth(img.naturalWidth, img.naturalHeight);
                requestAnimationFrame(step);
            };

            window.addEventListener('resize', function () {
                tileWidth = computeTileWidth(img.naturalWidth, img.naturalHeight);
            });

            function step(timestamp) {
                if (lastTime === null) lastTime = timestamp;
                const dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                if (tileWidth > 0) {
                    const pxPerSecond = tileWidth / LOOP_SECONDS;
                    offset = (offset + pxPerSecond * dt) % tileWidth;
                    const posX = (-offset) + 'px';
                    bgEls.forEach(function (el) {
                        if (el) el.style.backgroundPositionX = posX;
                    });
                }
                requestAnimationFrame(step);
            }
        })();
    </script>
